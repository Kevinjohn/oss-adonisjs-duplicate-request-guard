name: compat

on:
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:
  workflow_call:
  pull_request:
    paths:
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - index.ts
      - configure.ts
      - tsconfig.json
      - 'src/**'
      - 'stubs/**'
      - 'tests/**'
      - bin/test.ts
      - .github/workflows/compat.yml

permissions:
  contents: read

concurrency:
  group: compat-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  latest-peers:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with: { persist-credentials: false }
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Update to latest peer versions
        run: |
          PEER_NAMES=$(node -e '
            const p=require("./package.json"); const dev=p.devDependencies||{};
            for (const [n] of Object.entries(p.peerDependencies||{})) {
              if (n==="typescript") continue;
              if (/^https?:/.test(dev[n]||"")) continue;
              process.stdout.write(n+" ");
            }')
          pnpm update $PEER_NAMES
          pnpm list --depth 0 $PEER_NAMES
      - run: pnpm test
      - run: pnpm build
      - name: Test built guard with Account Kit
        env:
          TEST_BUILT_GUARD: '1'
        run: pnpm quick:test --files tests/kit.spec.ts
