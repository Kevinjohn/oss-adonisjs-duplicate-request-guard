name: checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with: { persist-credentials: false }
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: Test packed candidate in a clean SQLite host
        run: |
          mkdir -p tmp/consumer-package
          pnpm pack --pack-destination tmp/consumer-package
          bash bin/release_consumer_smoke.sh tmp/consumer-package/*.tgz
      - name: Test built guard with Account Kit
        env:
          TEST_BUILT_GUARD: '1'
        run: pnpm quick:test --files tests/kit.spec.ts
